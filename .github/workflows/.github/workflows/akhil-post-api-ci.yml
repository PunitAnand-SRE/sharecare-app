name: akhil-post-api-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'post/**'                  # 🎯 Triggers ONLY when code changes inside the post folder
      - '.github/workflows/akhil-post-api-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'post/**'
      - '.github/workflows/akhil-post-api-ci.yml'

jobs:
  akhil-automation-job:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post    # 📂 Targets the post microservice folder
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node Runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: post/package-lock.json

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Component Unit Tests
        run: npm test

      - name: Authenticate with Azure Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compile and Push Container Artifact
        uses: docker/build-push-action@v5
        with:
          context: post
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/post-api:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/post-api:latest
