name: Charity API CI

on:


  pull_request:
    branches:
      - main
      
    paths:
      - 'user/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: echo Build charity-api

      - name: Test
        run: echo Run tests

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          --password-stdin

      - name: Build Image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/user-api:latest \
          ./user

      - name: Push Image
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/user-api:latest

      - name: Azure Login action
        uses: azure/login@v2
        with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        enable-AzPSSession: true

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy User API
        run: |
          helm upgrade --install user-api \
            ./charts/chart-sharecare \
            --set image.repository=${{ secrets.ACR_LOGIN_SERVER }}/user \
            --set image.tag=latest