fullnameOverride: user-api-helm
image:
  repository: sharecareacr2026.azurecr.io/user-api
  tag: v1
containerPort: 3000
database:
  name: user_db
extraEnv:
  - name: PGSSLMODE
    value: "require"
  - name: DATABASE_SSL
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
ingress:
  enabled: false
