fullnameOverride: post-api-helm
image:
  repository: sharecareacr2026.azurecr.io/post-api
  tag: v1
containerPort: 3000
database:
  name: post_db
extraEnv:
  - name: MEDIA_API_URL
    value: "http://media-api-service"
  - name: PGSSLMODE
    value: "require"
  - name: DATABASE_SSL
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
ingress:
  enabled: false
