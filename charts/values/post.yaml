fullnameOverride: post-api-helm
image:
  repository: sharecareacr.azurecr.io/post-api
  tag: "latest"
containerPort: 3000
database:
  name: post
extraEnv:
  - name: MEDIA_API_URL
    value: "http://media-api-helm"
  - name: PGSSLMODE
    value: "require"
  - name: DATABASE_SSL
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
ingress:
  enabled: false
