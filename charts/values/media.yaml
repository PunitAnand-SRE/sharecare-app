fullnameOverride: media-api-helm
image:
  repository: sharecareacr2026.azurecr.io/media-api
  tag: v1
containerPort: 3000
database:
  name: media_db
extraEnv:
  - name: PGSSLMODE
    value: "require"
  - name: DATABASE_SSL
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
ingress:
  enabled: false
