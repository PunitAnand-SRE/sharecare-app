fullnameOverride: media-api-helm
image:
  repository: sharecareacr.azurecr.io/media-api
  tag: "latest"
containerPort: 3000
database:
  name: media
extraEnv:
  - name: PGSSLMODE
    value: "require"
  - name: DATABASE_SSL
    value: "true"
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
ingress:
  enabled: false
