
apiVersion: apps/v1

kind: Deployment

metadata:

  name: {{ include "sharecare.fullname" . }}

  labels:

    {{- include "sharecare.labels" . | nindent 4 }}

spec:

  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:

      {{- include "sharecare.selectorLabels" . | nindent 6 }}

  template:

    metadata:

      labels:

        {{- include "sharecare.selectorLabels" . | nindent 8 }}

    spec:

    {{- with .Values.imagePullSecrets }}

      imagePullSecrets:

        {{- toYaml . | nindent 8 }}

    {{- end }}

      serviceAccountName: {{ include "sharecare.serviceAccountName" . }}

      securityContext:

        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:

        - name: {{ .Chart.Name }}

          securityContext:

            {{- toYaml .Values.securityContext | nindent 12 }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:

            - name: DATABASE_HOST

              valueFrom:

                secretKeyRef:

                  name: {{ .Values.database.secretName }}

                  key: DB_HOST

            - name: DATABASE_USERNAME

              valueFrom:

                secretKeyRef:

                  name: {{ .Values.database.secretName }}

                  key: DB_USER

            - name: DATABASE_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: {{ .Values.database.secretName }}

                  key: DB_PASSWORD

            - name: DATABASE_NAME

              value: {{ .Values.database.name | quote }}

            - name: DATABASE_PORT

              value: {{ .Values.database.port | quote }}

            {{- with .Values.extraEnv }}

            {{- toYaml . | nindent 12 }}

            {{- end }}

          ports:

            - name: http

              containerPort: {{ .Values.containerPort }}

              protocol: TCP

          resources:

            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}

      nodeSelector:

        {{- toYaml . | nindent 8 }}

      {{- end }}

    {{- with .Values.affinity }}

      affinity:

        {{- toYaml . | nindent 8 }}

    {{- end }}

    {{- with .Values.tolerations }}

      tolerations:

        {{- toYaml . | nindent 8 }}

    {{- end }}

