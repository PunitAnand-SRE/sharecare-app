
replicaCount: 1

image:

  repository: sharecareacr.azurecr.io/user-api

  tag: latest

  pullPolicy: Always

imagePullSecrets:

  - name: acr-pull-secret

nameOverride: ""

fullnameOverride: ""

containerPort: 3000

database:

  secretName: sharecare-db-credentials

  name: postgres

  port: 5432

extraEnv: []

serviceAccount:

  create: false

  name:

podSecurityContext: {}

securityContext: {}

service:

  type: ClusterIP

  port: 80

ingress:

  enabled: true

  className: nginx

  annotations: {}

  host: ""

  path: /users

  pathType: Prefix

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

